    <!-- Tailwind CSS -->

    <!-- Lucide Icons -->

    <!-- Google Fonts Inter & JetBrains Mono -->

    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            touch-action: manipulation;
        }

        .font-mono-code {
            font-family: 'JetBrains Mono', monospace;
        }

        /* CRT 與 掃描線效果 */
        .crt-overlay {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        /* 滾動條美化 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.5);
            border-radius: 4px;
        }

        /* 立繪脈衝光暈 */
        @keyframes portraitPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
            50% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); }
        }
        .portrait-pulse {
            animation: portraitPulse 3s infinite ease-in-out;
        }

        /* 時間循環倒轉動畫 */
        @keyframes loopGlitched {
            0% { transform: translate(0); filter: hue-rotate(0deg); }
            20% { transform: translate(-5px, 5px); filter: hue-rotate(90deg); }
            40% { transform: translate(5px, -5px); filter: hue-rotate(180deg); }
            60% { transform: translate(-3px, -3px); filter: hue-rotate(270deg); }
            80% { transform: translate(3px, 3px); filter: hue-rotate(360deg); }
            100% { transform: translate(0); filter: hue-rotate(0deg); }
        }
        .glitch-active {
            animation: loopGlitched 0.4s infinite;
        }
    </style>
</head>

        // 音效系統 (使用 Web Audio API，避免外部資源加載失敗)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                if (type === 'type') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.02, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.start(now);
                    osc.stop(now + 0.04);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'reset') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.6);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            } catch(e) {}
        }

                text: "你順利輸入密碼 4092，打開保險箱拿到地下室萬能門禁卡與關閉手冊！",
                choices: [
                    { text: "直奔地下室關閉核心", next: "basement_climax" }
                ]
            },
            "steal_key": {
                time: "08:30 AM",
                speaker: "林奕",
                emotion: "緊張",
                suspicion: 50,
                bg: "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1200&q=80",
                ambient: "[ 陸雨晴在走廊製造噪音引開老陳，你成功潛入 ]",
                text: "你成功取得門禁卡，並與陸雨晴會合一同前往地下室！",
                choices: [
                    { text: "進入地下室深處", next: "basement_climax" }
                ]
            },
            "basement_climax": {
                time: "09:00 AM",
                speaker: "林奕",
                emotion: "震驚",
                suspicion: 10,
                bg: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80",
                ambient: "[ 巨大的蜂鳴聲響起，藍色的時間粒子在中央環形裝置中旋轉 ]",
                text: "你按照指示切斷電源、插入開關，時間發射器漸漸平息... 倒數計時歸零，一切歸於平靜。窗外的雨停了，陽光灑入，你長舒一口氣：「終於結束了...」",
                choices: [
                    { text: "閉上眼，迎接真正的明天 (9月9日)...", next: "twist_ending" }
                ]
            },
            "twist_ending": {
                time: "07:00 AM",
                speaker: "林奕",
                emotion: "絕望",
                suspicion: 100,
                bg: "https://images.unsplash.com/photo-1509114397022-ed747cca3f65?auto=format&fit=crop&w=1200&q=80",
                ambient: "[ 刺耳的鬧鐘聲再次炸響！ ]",
                text: "「嗶嗶嗶——！」手機螢幕亮起：【9月8日 週二 07:00 AM】...你渾身冰冷地發現：你關閉的只是外層循環，你依然陷在更深的第二層時間監獄中... [ 第一階段完成 · 敬請期待後續章節 ]",
                choices: [
                    { text: "重新開始試圖尋找真真相", next: "start_morning" }
                ]
            }
        };

        // 模態框切換
        function toggleModal(modalId, show) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            if (show) {
                if (modalId === 'character-modal') renderCharacterList();
                if (modalId === 'memory-modal') renderMemoryList();
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
            playSound('click');
        }
        window.toggleModal = toggleModal;

        // 渲染人物清單
        function renderCharacterList() {
            const container = document.getElementById('character-list');
            container.innerHTML = '';
            
            gameState.unlockedCharacters.forEach(charName => {
                const char = characters[charName];
                if (!char) return;
                const div = document.createElement('div');
                div.className = "bg-slate-950/80 border border-sky-500/30 p-2.5 rounded-xl flex items-center gap-3";
                div.innerHTML = `
                    <img src="${char.avatar}" class="w-10 h-10 rounded-lg object-cover border border-sky-400/50">
                    <div>
                        <div class="font-bold text-sky-300 flex items-center gap-2">
                            <span>${char.name}</span>
                            <span class="text-[10px] text-slate-400 font-normal">(${char.role})</span>
                        </div>
                        <div class="text-[11px] text-slate-300 mt-0.5 leading-snug">${char.desc}</div>
                    </div>
                `;
                container.appendChild(div);
            });
            document.getElementById('char-count').innerText = gameState.unlockedCharacters.size;
        }

        // 渲染記憶庫清單
        function renderMemoryList() {
            const container = document.getElementById('memory-list');
            container.innerHTML = '';

            if (gameState.unlockedMemories.size === 0) {
                container.innerHTML = '<div class="text-slate-500 text-center py-4">尚無繼承的記憶線索</div>';
                return;
            }

            gameState.unlockedMemories.forEach(memId => {
                const mem = memories[memId];
                if (!mem) return;
                const div = document.createElement('div');
                div.className = "bg-slate-950/80 border border-amber-500/40 p-2.5 rounded-xl";
                div.innerHTML = `
                    <div class="font-bold text-amber-300 flex items-center gap-1.5">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-400"></i>
                        <span>${mem.title}</span>
                    </div>
                    <div class="text-[11px] text-slate-300 mt-1 leading-snug">${mem.desc}</div>
                `;
                container.appendChild(div);
            });
            lucide.createIcons();
            document.getElementById('memory-count').innerText = gameState.unlockedMemories.size;
        }

        // 打字機效果渲染對話
        function typeText(elementId, text, callback) {
            const el = document.getElementById(elementId);
            el.innerHTML = '';
            gameState.isTyping = true;
            let i = 0;

            function step() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    if (i % 3 === 0) playSound('type');
                    i++;
                    setTimeout(step, 20);
                } else {
                    gameState.isTyping = false;
                    if (callback) callback();
                }
            }
            step();
        }

        // 渲染當前場景
        function renderScene(sceneKey) {
            const scene = scenes[sceneKey];
            if (!scene) return;

            gameState.currentScene = sceneKey;

            // 時間循環重置處理
            if (sceneKey === 'start_morning' && gameState.loopCount > 1) {
                document.getElementById('app').classList.add('glitch-active');
                playSound('reset');
                setTimeout(() => {
                    document.getElementById('app').classList.remove('glitch-active');
                }, 500);
            }

            // 更新死亡/循環計數
            if (scene.isDeath) {
                gameState.loopCount++;
                document.getElementById('loop-counter').innerText = `LOOP #${gameState.loopCount}`;
            }

            // 解鎖線索與角色
            if (scene.unlockMemory) {
                gameState.unlockedMemories.add(scene.unlockMemory);
                document.getElementById('memory-count').innerText = gameState.unlockedMemories.size;
            }
            if (scene.unlockChar) {
                gameState.unlockedCharacters.add(scene.unlockChar);
                document.getElementById('char-count').innerText = gameState.unlockedCharacters.size;
            }

            // 更新 UI 頂部與面板數據
            document.getElementById('clock-text').innerText = scene.time;
            document.getElementById('speaker-name').innerText = scene.speaker;
            document.getElementById('suspicion-level').innerText = `${scene.suspicion}%`;
            document.getElementById('emotion-badge').innerText = scene.emotion;
            document.getElementById('ambient-text').innerText = scene.ambient;

            // 背景圖與角色頭像
            if (scene.bg) {
                document.getElementById('scene-bg').style.backgroundImage = `linear-gradient(to bottom, rgba(5, 6, 8, 0.4), rgba(5, 6, 8, 0.85)), url('${scene.bg}')`;
            }
            
            const charObj = characters[scene.speaker];
            if (charObj) {
                document.getElementById('speaker-avatar').src = charObj.avatar;
            }

            // 打字機對話文本與選項生成
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';

            typeText('dialogue-text', scene.text, () => {
                if (scene.choices) {
                    scene.choices.forEach(choice => {
                        // 記憶條件過濾
                        if (choice.reqMemory && !gameState.unlockedMemories.has(choice.reqMemory)) {
                            return;
                        }

                        const btn = document.createElement('button');
                        const isMemoryChoice = !!choice.reqMemory;
                        
                        btn.className = `w-full p-3 sm:p-3.5 text-left text-xs sm:text-sm rounded-xl border transition-all duration-200 flex items-center justify-between group active:scale-[0.98] ${
                            isMemoryChoice 
                            ? 'bg-amber-950/60 border-amber-500/80 text-amber-200 hover:bg-amber-900/80 shadow-lg' 
                            : 'bg-slate-900/90 border-slate-800/90 text-slate-200 hover:bg-slate-800 hover:border-slate-600'
                        }`;

                        btn.innerHTML = `
                            <span class="font-medium tracking-wide flex items-center gap-2">
                                ${isMemoryChoice ? '<i data-lucide="sparkles" class="w-4 h-4 text-amber-400 animate-pulse"></i>' : ''}
                                ${choice.text}
                            </span>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500 group-hover:translate-x-1 transition-transform"></i>
                        `;

                        btn.onclick = () => {
                            if (!gameState.isTyping) {
                                playSound('click');
                                renderScene(choice.next);
                            }
                        };

                        choicesContainer.appendChild(btn);
                    });
                    lucide.createIcons();
                }
            });
        }

        window.onload = function() {
            lucide.createIcons();
            renderScene('start_morning');
        };
    </script>
</body>
